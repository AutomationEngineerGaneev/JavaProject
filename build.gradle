plugins {
    id 'java'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
    implementation group: 'org.json', name: 'json', version: '20240303'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.18.2'
    implementation group: 'io.qameta.allure', name: 'allure-testng', version: '2.29.1'
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.36'
//    testImplementation group: 'org.testng', name: 'testng', version: '7.10.2'
    testImplementation group: 'io.rest-assured', name: 'rest-assured', version: '5.5.0'
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'



}

test {
    useJUnitPlatform()
}